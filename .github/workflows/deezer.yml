name: Update Digital Artists

on:
  workflow_dispatch:

jobs:
  update-artists:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ARTIST }}@github.com/wonpyu/digital-artist-private.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: digital-artist-private
        run: npm install

      - name: Install Playwright
        working-directory: digital-artist-private
        run: npx playwright install chromium --with-deps

      - name: Run Scraper
        working-directory: digital-artist-private
        run: node scrape.js

      - name: Copy generated files
        run: |
          cp -f digital-artist-private/digital-artists.json . 2>/dev/null || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add digital-artists.json

          git diff --staged --quiet || git commit -m "update digital artists"

          git push
