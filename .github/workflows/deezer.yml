name: Deezer Chart

on:
workflow_dispatch:
repository_dispatch:

permissions:
contents: write

jobs:
update-deezer:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Dependencies
    run: |
      npm install node-fetch@2

  - name: Run Deezer Scraper
    run: node deezer.js

  - name: Commit Updates
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add .

      git diff --staged --quiet || git commit -m "Update Deezer Chart"

      git push
